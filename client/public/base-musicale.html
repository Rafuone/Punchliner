<!doctype html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PUNCHLINR — Base musicale · Curation</title>
<style>
  @font-face{font-family:'Satoshi';src:url('/fonts/satoshi-400.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Satoshi';src:url('/fonts/satoshi-500.woff2') format('woff2');font-weight:500;font-display:swap}
  @font-face{font-family:'Satoshi';src:url('/fonts/satoshi-700.woff2') format('woff2');font-weight:700;font-display:swap}
  :root{ --bg:#0e0f11; --card:#16181c; --card2:#1b1e23; --line:#2a2e35; --txt:#f1f2ef; --muted:#9aa0a6;
    --top:#a6ff00; --high:#49a9ff; --mid:#ff9a3e; --deep:#ff5db1; --exc:#7a828c; }
  *{box-sizing:border-box}
  button,input,select,optgroup,textarea{font-family:inherit}   /* les contrôles n'héritent pas la police par défaut → on force Satoshi partout */
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 'Satoshi',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{flex:0 0 auto;background:linear-gradient(180deg,#0e0f11 70%,rgba(14,15,17,.92));border-bottom:1px solid var(--line);padding:12px 16px 10px}
  h1{margin:0;font-size:18px;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
  h1 b{color:var(--top)}
  h1 .st{font-size:12px;color:var(--muted);font-weight:400;margin-left:auto}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:9px}
  input[type=search]{flex:1 1 220px;min-width:160px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px 11px;font-size:13px}
  select,.tgl{background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px 10px;font-size:12.5px;cursor:pointer}
  .tgl{user-select:none;display:inline-flex;align-items:center;gap:6px;font-weight:600}
  .tgl.on{border-color:var(--top);color:var(--top);background:#171b10}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .dch{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:999px;padding:6px 11px;font-size:12px;cursor:pointer;user-select:none;font-weight:600}
  .qlink{cursor:pointer}
  .qlink:hover{text-decoration:underline;color:var(--txt)}
  .fx{opacity:.65;font-weight:400}
  .dch.off{opacity:.36}
  .act{margin-left:auto;display:flex;gap:8px}
  .btn{padding:8px 13px;border-radius:7px;border:1px solid var(--line);background:#1a1c22;color:#cfd3d8;font-weight:700;cursor:pointer;font-size:12.5px}
  .btn:hover{border-color:#5a616b}
  .btn.go{border-color:var(--top);background:#191d10;color:var(--top)}
  .btn.apply{border-color:#ffb02e;background:#20180a;color:#ffb02e}
  .board{flex:1 1 auto;display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:10px;padding:10px 12px 12px;overflow-x:auto;min-height:0}
  .col{background:#121317;border:1px solid var(--line);border-radius:11px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .col.drop{outline:2px dashed var(--top);outline-offset:-3px}
  .colh{flex:0 0 auto;padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.03em;font-size:13px}
  .colh .dot{width:11px;height:11px;border-radius:50%}
  .colh .n{margin-left:auto;color:var(--muted);font-weight:600;font-size:12px;font-variant-numeric:tabular-nums}
  .col[data-c=gp] .colh{color:var(--top)} .col[data-c=co] .colh{color:var(--high)}
  .col[data-c=rm] .colh{color:var(--mid)} .col[data-c=ex] .colh{color:var(--exc)}
  .colb{flex:1 1 auto;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin}
  .subh{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:6px 2px 2px;display:flex;gap:7px;align-items:center}
  .subh .dot{width:8px;height:8px;border-radius:50%}
  .card{background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:7px 8px;display:flex;align-items:center;gap:8px;cursor:grab}
  .card[data-b=top]{border-left-color:var(--top)} .card[data-b=high]{border-left-color:var(--high)}
  .card[data-b=mid]{border-left-color:var(--mid)} .card[data-b=deep]{border-left-color:var(--deep)} .card[data-b=exc]{border-left-color:var(--exc)}
  .card.playing{background:var(--card2);box-shadow:0 0 0 1px var(--top) inset}
  .card.edited{outline:1px dashed var(--top);outline-offset:-1px}
  .card.unl{border-left-style:dashed}
  .play{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid #46561d;background:#1a2010;color:var(--top);font-size:11px;cursor:pointer;display:grid;place-items:center;padding-left:2px}
  .play:disabled{opacity:.35;cursor:default;border-color:var(--line);background:#0c0d0f}
  .play:hover{border-color:var(--top)}
  .cov{flex:0 0 auto;width:34px;height:34px;border-radius:5px;object-fit:cover;background:#222}
  .meta{flex:1 1 auto;min-width:0}
  .ttl{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
  .art{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .yr{flex:0 0 auto;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
  .unlb{flex:0 0 auto;font-size:9px;font-weight:800;color:#0a0b0d;background:var(--mid);border-radius:4px;padding:2px 4px;letter-spacing:.04em}
  .mv{display:flex;gap:3px;flex:0 0 auto}
  .mb{font:800 10px/1 ui-sans-serif,system-ui;padding:5px 6px;border-radius:5px;border:1px solid #333;background:#1a1c22;color:#9aa;cursor:pointer;white-space:nowrap}
  .mb:hover{border-color:#666;color:#ccc}
  .mb[data-t=gp].on{background:var(--top);border-color:var(--top);color:#0a0b0d}
  .mb[data-t=co].on{background:var(--high);border-color:var(--high);color:#0a0b0d}
  .mb[data-t=rm].on{background:var(--mid);border-color:var(--mid);color:#0a0b0d}
  .mb[data-t=ex]{color:#e66} .mb[data-t=ex].on{background:#c0182b;border-color:#c0182b;color:#fff}
  .sub{display:flex;gap:3px;flex:0 0 auto;margin-left:2px}
  .sb{font:700 9.5px/1 ui-sans-serif;padding:4px 5px;border-radius:4px;border:1px solid #333;background:#15171c;color:#9aa;cursor:pointer}
  .sb[data-b=mid].on{background:var(--mid);border-color:var(--mid);color:#0a0b0d}
  .sb[data-b=deep].on{background:var(--deep);border-color:var(--deep);color:#0a0b0d}
  .more{color:var(--muted);text-align:center;font-size:11.5px;padding:8px;cursor:pointer}
  .more:hover{color:var(--txt)}
  .empty{color:#565c64;text-align:center;padding:24px 8px;font-size:12px}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#191d10;border:1px solid var(--top);color:var(--top);padding:10px 16px;border-radius:8px;font-weight:700;font-size:13px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
  #spbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;align-items:center;gap:8px;background:#0a0b0d;border-top:1px solid var(--line);padding:6px 10px}
  #spbar.on{display:flex}
  #spbar #sp-embed{flex:1 1 auto;min-width:0}
  #spbar #spclose{flex:0 0 auto;background:#1a1c22;border:1px solid var(--line);color:#9aa;border-radius:6px;width:30px;height:30px;cursor:pointer}
  .toast.on{opacity:1}
  .toast.err{background:#20120f;border-color:#e66;color:#f88}
  .toast{max-width:min(560px,92vw)}
  .toast.stick{pointer-events:auto;cursor:pointer;padding-right:34px}
  .toast.stick::after{content:'✕';position:absolute;right:12px;top:50%;transform:translateY(-50%);opacity:.55;font-size:12px}
  .btn.busy{opacity:.75;cursor:progress}
  .btn.busy::after{content:'';display:inline-block;width:10px;height:10px;margin-left:7px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-1px;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #ovl{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;place-items:center;z-index:99;padding:24px}
  #ovl.on{display:grid}
  #ovl .box{background:#14161b;border:1px solid #2a2e35;border-radius:10px;padding:16px;max-width:760px;width:100%}
  #ovl textarea{width:100%;height:300px;background:#0c0d0f;color:#cde;border:1px solid #333;border-radius:6px;padding:10px;font:12px/1.4 ui-monospace,monospace}
  #ovl .r{display:flex;gap:8px;margin-top:10px}
  #pvl{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;place-items:center;z-index:99;padding:24px}
  #pvl.on{display:grid}
  #pvl .box{background:#14161b;border:1px solid var(--top);border-radius:10px;padding:16px;max-width:620px;width:100%}
  #pvl textarea{width:100%;height:150px;background:#0c0d0f;color:#e8ece4;border:1px solid #333;border-radius:6px;padding:10px;font:13px/1.45 ui-sans-serif,system-ui;box-sizing:border-box}
  #pvl .r{display:flex;gap:8px;margin-top:10px}
  kbd{background:#22252b;border:1px solid #3a3f47;border-bottom-width:2px;border-radius:4px;padding:1px 5px;font:600 11px ui-monospace;color:#cfd3d8}
</style></head><body>
<header>
  <h1><b>PUNCHLINR</b> — Base musicale · Curation <span class="st" id="st">chargement…</span></h1>
  <div class="bar">
    <input type="search" id="q" placeholder="Rechercher artiste / titre…">
    <div class="chips" id="dec"></div>
    <span class="tgl" id="tUnl" title="N'afficher que les titres sans extrait jouable (à résoudre)">Sans audio <b id="tUnlN" style="color:var(--mid)"></b></span>
    <span class="tgl" id="tEd" title="N'afficher que TES reclassements pas encore envoyés au serveur (bouton ⚡ Appliquer)">Modifiés <b id="tEdN" style="color:var(--top)"></b></span>
    <span style="font-size:11px;color:#7a7a7a;line-height:1.3">⌨ 1·2·3 classer · Espace = écouter · Ctrl+Z annuler · clic carte = sélectionner</span>
    <div class="act">
      <button class="btn" id="artdash" title="Tableau de bord : tous les artistes de la base + nombre de titres par tier (repérer les couvertures trop fines / artistes manquants)">📊 Artistes</button>
      <button class="btn" id="spfill" title="Cherche sur Spotify (ton compte) l'audio + la cover des titres muets. À lancer sur http://127.0.0.1:5173">🔊 Remplir l'audio manquant</button>
      <button class="btn apply" id="apply">⚡ Appliquer au serveur</button>
    </div>
  </div>
</header>
<div class="board" id="board">
  <section class="col" data-c="gp"><div class="colh"><span class="dot" style="background:var(--top)"></span>Mainstream<span class="n" id="n-gp"></span></div><div class="colb" id="b-gp"></div></section>
  <section class="col" data-c="co"><div class="colh"><span class="dot" style="background:var(--high)"></span>Connaisseur<span class="n" id="n-co"></span></div><div class="colb" id="b-co"></div></section>
  <section class="col" data-c="rm"><div class="colh"><span class="dot" style="background:var(--mid)"></span>Puriste<span class="n" id="n-rm"></span></div><div class="colb" id="b-rm"></div></section>
  <section class="col" data-c="ex"><div class="colh"><span class="dot" style="background:var(--exc)"></span>Hors pool<span class="n" id="n-ex"></span></div><div class="colb" id="b-ex"></div></section>
</div>
<audio id="au"></audio>
<div id="spbar"><div id="sp-embed"></div><button id="spclose" title="Fermer le lecteur Spotify">✕</button></div>
<div id="apool"><div class="ah"><b id="apool-t">Top Spotify</b><button id="apool-x" title="Fermer">✕</button></div><div id="apool-b"></div></div>
<style>
#apool{position:fixed;top:0;right:0;width:360px;max-width:92vw;height:100%;background:#141414;border-left:1px solid #2a2a2a;box-shadow:-8px 0 30px #000a;transform:translateX(102%);transition:transform .18s;z-index:60;display:flex;flex-direction:column}
#apool.on{transform:none}
#apool .ah{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #2a2a2a;font-size:15px}
#apool .ah button{margin-left:auto;background:none;border:0;color:#ccc;font-size:16px;cursor:pointer;line-height:1}
#apool-b{overflow:auto;padding:4px 6px}
.ap-row{display:flex;align-items:center;gap:8px;padding:7px 6px}
.ap-row+.ap-row{border-top:1px solid #232323}
.ap-row.has{opacity:.55}
.ap-meta{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.ap-n{color:#666;font-size:12px;width:16px;text-align:right;flex:none}
.ap-t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap-a{font-size:11px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap-in{font-size:11px;color:#7ec87e;white-space:nowrap;flex:none}
.ap-add{display:flex;gap:3px;flex:none}
.ap-add button{font-size:10px;padding:3px 5px;background:#222;border:1px solid #3a3a3a;color:#ddd;border-radius:5px;cursor:pointer}
.ap-add button:hover{background:#2e2e2e}
.ap-msg{padding:16px;color:#999;font-size:13px;line-height:1.5}
.ap-artist{display:flex;align-items:center;gap:11px;padding:11px 10px 12px;border-bottom:1px solid #262626;position:sticky;top:0;background:#141414;z-index:2}
.ap-artist img{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none}
.ap-an{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap-af{font-size:11.5px;color:var(--top);font-weight:700}
.ap-cv{width:36px;height:36px;border-radius:5px;object-fit:cover;flex:none;background:#222}
.ap-meta2{flex:1;min-width:0}
.ap-grp{margin:2px 0 12px}
.ap-gh{display:flex;align-items:center;gap:8px;padding:8px 6px 6px;position:sticky;top:0;background:#141414;z-index:1;border-bottom:1px solid #262626}
.ap-gh img,.ap-gc{width:34px;height:34px;border-radius:5px;object-fit:cover;flex:none;background:#222}
.ap-gh b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ap-gt{margin-left:auto;font-size:9.5px;color:#777;text-transform:uppercase;letter-spacing:.07em;flex:none}
.ap-pop{display:inline-block;width:66px;height:5px;border-radius:3px;background:#2a2a2a;overflow:hidden;vertical-align:middle;margin-top:3px}
.ap-pop i{display:block;height:100%;background:linear-gradient(90deg,#ff9a3e,#a6ff00)}
.ap-popn{font-size:10px;color:#9aa;margin-left:6px;font-weight:700;font-variant-numeric:tabular-nums}
.rk{font-size:10px;font-weight:800;border-radius:5px;padding:1px 5px;margin-right:5px;flex:none}
.rk.rtop{color:#0b0b0b;background:#ffcf5a}
.rk.rmid{color:#ffcf5a;background:#2a2410;border:1px solid #5a4a1e}
.rk.rlow{color:#9a9a9a;background:#1e1e1e;border:1px solid #333}
.card.sel{outline:2px solid var(--top);outline-offset:-2px;background:#1b2410}
#selbar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(160%);transition:transform .18s;display:flex;align-items:center;gap:8px;background:#12140e;border:1px solid var(--top);padding:9px 12px;border-radius:10px;z-index:55;box-shadow:0 8px 30px #000a;font-size:13px;flex-wrap:wrap;max-width:94vw}
#selbar.on{transform:translateX(-50%)}
#selbar button{font-size:12px;padding:5px 9px;border-radius:6px;border:1px solid #3a3a3a;background:#1c1e16;color:#ddd;cursor:pointer}
#selbar button:hover{border-color:var(--top)}
#selbar button.clr{margin-left:6px;border-color:#553;color:#caa}
#selbar button[data-c="gp"]{color:#a6ff00;border-color:#3d5200}
#selbar button[data-c="co"]{color:#49a9ff;border-color:#1d4a70}
#selbar button[data-c="rm"]{color:#ff9a3e;border-color:#6b4213}
#selbar button[data-c="ex"]{color:#9aa0a6;border-color:#3a3f45}
#selbar button[data-c="gp"]:hover{background:#a6ff00;color:#0b0b0b;border-color:#a6ff00}
#selbar button[data-c="co"]:hover{background:#49a9ff;color:#0b0b0b;border-color:#49a9ff}
#selbar button[data-c="rm"]:hover{background:#ff9a3e;color:#0b0b0b;border-color:#ff9a3e}
#selbar button[data-c="ex"]:hover{background:#7a828c;color:#0b0b0b;border-color:#7a828c}
.card.playing .play{background:var(--top)!important;color:#0b0b0b!important;border-color:var(--top);animation:playpulse 1.1s ease-in-out infinite}
@keyframes playpulse{0%,100%{box-shadow:0 0 0 0 rgba(166,255,0,.55)}50%{box-shadow:0 0 0 6px rgba(166,255,0,0)}}
#nowplaying{position:fixed;bottom:16px;right:16px;display:none;align-items:center;gap:9px;background:#12140e;border:1px solid var(--top);padding:8px 11px;border-radius:10px;z-index:56;box-shadow:0 8px 26px #000a;max-width:min(360px,80vw)}
#nowplaying.on{display:flex}
#nowplaying .npd{width:8px;height:8px;border-radius:50%;background:var(--top);flex:none;animation:playpulse 1.1s ease-in-out infinite}
#nowplaying #np-txt{font-size:12px;color:#dfe3d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nowplaying #np-stop{background:none;border:0;color:#aaa;cursor:pointer;font-size:14px;flex:none;line-height:1}
/* ── Tableau de bord Artistes ─────────────────────────────────────── */
#adash{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);z-index:70;display:none;align-items:center;justify-content:center;padding:24px}
#adash.on{display:flex}
#adash .ad-panel{width:min(880px,96vw);max-height:92vh;background:#111;border:1px solid #2a2a2a;border-radius:12px;box-shadow:0 20px 70px #000c;display:flex;flex-direction:column;overflow:hidden}
.ad-head{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid #262626;flex-wrap:wrap}
.ad-head>b{font-size:15px}
#ad-q{flex:1;min-width:140px;background:#1a1a1a;border:1px solid #333;border-radius:7px;padding:6px 10px;color:#eee;font-size:13px}
.ad-sub{font-size:11.5px;color:#8a8a8a;white-space:nowrap}
.ad-sortl{font-size:11px;color:#777}
#ad-sort{background:#1a1a1a;border:1px solid #333;border-radius:7px;padding:5px 7px;color:#ddd;font-size:12px}
#ad-x{background:none;border:0;color:#ccc;font-size:17px;cursor:pointer;line-height:1;padding:2px 4px}
.ad-scroll{overflow:auto}
#ad-tab{width:100%;border-collapse:collapse;font-size:13px}
#ad-tab thead th{position:sticky;top:0;background:#161616;z-index:1;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#8a8a8a;border-bottom:1px solid #2a2a2a;font-weight:700}
#ad-tab th.l,#ad-tab td.l{text-align:left}
#ad-tab th.c,#ad-tab td.c{text-align:center;width:56px}
#ad-tab td{padding:7px 10px;border-bottom:1px solid #1e1e1e;font-variant-numeric:tabular-nums}
#ad-tab tbody tr{cursor:pointer}
#ad-tab tbody tr:hover{background:#1b1b1b}
#ad-tab td.l{font-weight:600;color:#eaeaea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
#ad-tab td.rank{color:#6a6a6a;text-align:right;width:40px;padding-right:2px;font-size:12px}
#ad-tab td.c{color:#454545}
#ad-tab td.c.v{font-weight:800}
#ad-tab td.cg.v{color:var(--top)} #ad-tab td.cc.v{color:var(--high)} #ad-tab td.cr.v{color:var(--mid)} #ad-tab td.ce.v{color:var(--exc)} #ad-tab td.cu.v{color:#ff6b9d}
#ad-tab td.ct{color:#e6e8ea;font-weight:800}
#ad-tab tr.thin td.ct{color:#ffcf5a}
#ad-tab thead th.cg{color:var(--top)} #ad-tab thead th.cc{color:var(--high)} #ad-tab thead th.cr{color:var(--mid)} #ad-tab thead th.ce{color:var(--exc)}
.ad-empty{padding:24px;text-align:center;color:#888;line-height:1.7}
.ad-explore{margin-top:10px;background:var(--top);color:#0b0b0b;border:0;border-radius:7px;padding:8px 14px;font-weight:800;cursor:pointer;font-size:13px}
.ad-explore:hover{filter:brightness(1.08)}
.ad-seg{display:flex;border:1px solid #333;border-radius:8px;overflow:hidden;flex:none}
.ad-seg button{background:#161616;border:0;color:#9aa0a6;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.ad-seg button+button{border-left:1px solid #333}

<div id="adash"><div class="ad-panel">
  <div class="ad-head">

    <input type="search" id="ad-q" placeholder="filtrer / explorer un artiste…">

      <option value="tot">Total titres ↓</option>

    <th class="rank" title="Rang dans le tri courant">#</th><th class="l">Artiste</th><th class="c cg" title="Titres classés Mainstream (grand public)">Main</th><th class="c cc" title="Titres classés Connaisseur">Conn</th><th class="c cr" title="Titres classés Puriste">Puri</th><th class="c ce" title="Hors pool (retirés du jeu)">Hors</th><th class="c ct" title="Total jouable = Main + Conn + Puri">Pool</th><th class="c cu" title="Titres sans audio (à résoudre)">♪…</th>
  </tr></thead><tbody id="ad-body"></tbody></table><div id="ad-gaps" style="display:none"></div></div>
</div></div>
<div class="toast" id="toast"></div>
<div id="selbar"><b><span id="selN">0</span> sélectionné(s)</b><span style="opacity:.65">→ déplacer :</span><button data-c="gp">Mainstream</button><button data-c="co">Connaisseur</button><button data-c="rm">Puriste</button><button data-c="ex">✕ Hors pool</button><button id="selclr" class="clr">Désélectionner</button></div>
<div id="nowplaying"><span class="npd"></span><span id="np-txt"></span><button id="np-stop" title="Arrêter la lecture">✕</button></div>
<script>
// ── mapping 3 difficultés ↔ 4 colonnes (RobMaïzi = mid+deep, avec sous-nuance Digger/Puriste) ─────────
const COLS = { gp:{band:'top'}, co:{band:'high'}, rm:{band:'mid'}, ex:{band:'exc'} };
const BAND2COL = { top:'gp', high:'co', mid:'rm', deep:'rm', exc:'ex' };
const TARGET_GP = 300;                                  // objectif « grand public » (actuellement ~160)
const CAP = 90;                                         // rendu max par colonne (le reste via « afficher plus ») — baissé pour alléger l'affichage sur petites configs
const el = (id)=>document.getElementById(id);
const esc = (s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let ALL = [], EXSET = new Set(), SUM = {};
let changes = {}; try{ changes = JSON.parse(localStorage.getItem('pl_curation_v2')||'{}'); }catch(e){}
const save = ()=>{ try{ localStorage.setItem('pl_curation_v2', JSON.stringify(changes)); }catch(e){} };
const filt = { q:'', dec:new Set(['90','00','10','20','x']), scene:'', unl:false, ed:false, nocov:false };
let _sel = new Set(), _hist = [];   // sélection multiple + pile d'annulation (Ctrl+Z)
const caps = { gp:CAP, co:CAP, rm:CAP, ex:CAP };
let activeKey = null;

const decOf = (y)=> !y ? 'x' : y<2000?'90':y<2010?'00':y<2020?'10':'20';
const decRow = (r)=> (r.dec && r.dec!=='x') ? r.dec : decOf(r.y);   // décennie : celle de la liste, sinon déduite de l'année
const effTarget = (r)=> changes[r.k] || r.b;            // 'top'|'high'|'mid'|'deep'|'exc'
const effCol = (r)=> BAND2COL[effTarget(r)] || 'rm';
const isUnl = (r)=> !r.preview && !r.sp;   // « sans audio » = ni Deezer ni Spotify

// ── audio ────────────────────────────────────────────────────────────────────────────────────────────
const au = el('au'); let curCard = null;
// ── Lecteur Spotify (iFrame API) : audio des titres importés (complet si connecté Premium dans ce navigateur, sinon extrait) ──
let spCtrl = null;
window.onSpotifyIframeApiReady = (API) => { try{ API.createController(el('sp-embed'), { width:'100%', height:80, uri:'spotify:track:4cOdK2wGLETKBW3PvgPWqT' }, (c)=>{ spCtrl = c; }); }catch(e){} };
function spPlay(id){ if(!spCtrl) return false; try{ el('spbar').classList.add('on'); spCtrl.loadUri('spotify:track:'+id); spCtrl.play(); return true; }catch(e){ return false; } }
el('spclose') && el('spclose').addEventListener('click', ()=>{ try{ spCtrl && spCtrl.pause(); }catch(e){} el('spbar').classList.remove('on'); });
el('np-stop') && el('np-stop').addEventListener('click', stop);
function showNow(r){ const n=el('nowplaying'); if(!n) return; el('np-txt').textContent=r.t+' — '+r.a; n.classList.add('on'); }
function hideNow(){ const n=el('nowplaying'); if(n) n.classList.remove('on'); }
function stop(){ try{au.pause();}catch(e){} try{ if(spCtrl) spCtrl.pause(); }catch(e){} if(curCard){curCard.classList.remove('playing');curCard=null;} hideNow(); }
function playRec(r, card){
  if(curCard===card){ stop(); return; }
  stop(); activeKey = r.k;
  if(r.sp && spPlay(r.sp)){ card.classList.add('playing'); curCard = card; card.scrollIntoView({block:'nearest'}); showNow(r); return; }   // Spotify d'abord (titres importés)
  if(!r.preview){ return; }                             // ni Spotify ni Deezer → rien à jouer
  au.src = r.preview; au.play().catch(()=>{});
  card.classList.add('playing'); curCard = card;
  card.scrollIntoView({block:'nearest'}); showNow(r);
}
au.addEventListener('ended', ()=>{ stop(); });   // on joue UN extrait puis stop (plus d'enchaînement auto)

// ── data ──────────────────────────────────────────────────────────────────────────────────────────────
async function load(){
  el('st').textContent='chargement…';
  const res = await fetch('/api/curation?_='+Date.now(), {cache:'no-store'}).then(r=>r.json()).catch(()=>null);   // anti-cache : sinon le navigateur resert l'ancien décompte après un drop
  if(!res){ el('st').textContent='⚠ serveur injoignable (lance le localhost)'; return; }
  EXSET = new Set(res.excluded.map(r=>r.k));
  ALL = res.rows.map(r=>({...r, ex:false})).concat(res.excluded.map(r=>({...r, b:'exc', labeled:true, ex:true})));
  render();
}

// ── rendu ────────────────────────────────────────────────────────────────────────────────────────────
function passFilter(r){
  if(filt.q){ const h=(r.a+' '+r.t+' '+((r.f||[]).join(' '))).toLowerCase(); if(!h.includes(filt.q)) return false; }  // cherche aussi dans les feats
  if(!filt.dec.has(decRow(r))) return false;
  if(filt.scene && !(r.g||[]).includes(filt.scene)) return false;
  if(filt.unl && !isUnl(r)) return false;
  if(filt.ed && !changes[r.k]) return false;
  if(filt.nocov && r.c) return false;
  return true;
}
function cardHTML(r){
  const t = effTarget(r);
  const cov = r.c ? `<img class="cov" loading="lazy" src="${esc(r.c)}" alt="">` : '<div class="cov"></div>';
  const unl = isUnl(r) ? '<span class="unlb" title="pas encore résolu sur Deezer">♪…</span>' : '';
  const _na = r.a.toLowerCase(), _fts = [...new Set((r.f||[]).filter(x=>x && !_na.includes(x.toLowerCase())))];   // feats à afficher (hors artiste principal, dédupliqués)
  const _pa = (r.a.split(/\s*(?:feat\.?|ft\.?|featuring|avec|&|,| x )\s*/i)[0] || r.a).trim();   // artiste principal (clic → recherche + top Spotify)
  const feat = _fts.length ? ` <span class="fx">feat. ${_fts.map(f=>`<span class="qlink" data-q="${esc(f)}">${esc(f)}</span>`).join(', ')}</span>` : '';
  const rk = r.spRank ? `<span class="rk r${r.spRank<=3?'top':(r.spRank<=5?'mid':'low')}" title="#${r.spRank} des titres les plus streamés de ${_pa} sur Spotify">#${r.spRank}</span>` : '';
  // plus de boutons de colonne sur la carte : on classe par glisser-déposer d'une colonne à l'autre
  return `<div class="card${changes[r.k]?' edited':''}${isUnl(r)?' unl':''}${_sel.has(r.k)?' sel':''}" data-k="${esc(r.k)}" data-b="${t}" draggable="true">`+
    `<button class="play"${isUnl(r)?' disabled':''}>▶</button>${cov}`+
    `<div class="meta"><div class="ttl">${esc(r.t)}</div><div class="art"><span class="qlink" data-q="${esc(_pa)}">${esc(r.a)}</span>${feat}</div></div>`+
    `${unl}${rk}<span class="yr">${r.y||''}</span></div>`;
}
function render(){
  const buckets = { gp:[], co:[], rm:[], ex:[] };
  SUM = { gp:0, co:0, rm:0, ex:0 };
  let unlN=0, edN=0;
  const _flt = (filt.q || filt.scene || filt.unl || filt.ed || filt.dec.size < 5);   // un filtre actif ? → compteurs de colonnes dynamiques (filtré / total)
  for(const r of ALL){
    const c = effCol(r); SUM[c]++;
    if(isUnl(r)) unlN++; if(changes[r.k]) edN++;
    if(passFilter(r)) buckets[c].push(r);
  }
  // tri : non classés d'abord (à traiter), puis modifiés, puis par notoriété
  const ord = (a,b)=> ((!!changes[b.k])-(!!changes[a.k])) || (isUnl(a)-isUnl(b)) || (b.rank-a.rank);
  for(const c of ['gp','co','rm','ex']){
    const arr = buckets[c].sort(ord);
    const box = el('b-'+c); const shown = arr.slice(0, caps[c]);
    let html = shown.map(cardHTML).join('');
    if(!arr.length) html = '<div class="empty">— rien ici —</div>';
    else if(arr.length>caps[c]) html += `<div class="more" data-c="${c}">+ ${arr.length-caps[c]} autres — afficher</div>`;
    box.innerHTML = html;
    el('n-'+c).textContent = _flt ? (arr.length + ' / ' + (c==='gp' ? SUM.gp : SUM[c])) : (c==='gp' ? `${SUM.gp} / ${TARGET_GP}` : String(SUM[c]));
  }
  el('tUnlN').textContent = unlN ? '· '+unlN : '';
  el('tEdN').textContent = edN ? '· '+edN : '';
  el('st').textContent = `${ALL.length} titres · ${edN} modif${edN>1?'s':''}${edN?' (non appliqués)':''}`;
}
// DÉLÉGATION : un seul écouteur sur le board (au lieu d'en ré-attacher ~1000 à chaque rendu → c'était ça le lag).
function setupBoard(){
  const board = el('board');
  board.addEventListener('click', e=>{
    const more = e.target.closest('.more'); if(more){ caps[more.dataset.c] = (caps[more.dataset.c]||CAP) + CAP; render(); return; }
    const ql = e.target.closest('.qlink'); if(ql){ const q = ql.dataset.q||''; el('q').value = q; filt.q = q.toLowerCase(); render(); showArtistPool(q); return; }   // clic artiste/feat → recherche + top Spotify de l'artiste
    const card = e.target.closest('.card'); if(!card) return;
    const r = ALL.find(x=>x.k===card.dataset.k); if(!r) return;
    if(e.target.closest('.play')){ playRec(r, card); return; }
    toggleSel(card);   // clic sur le corps de la carte = (dé)sélectionner → action groupée via la barre en bas
  });
  board.addEventListener('dragstart', e=>{ const card=e.target.closest('.card'); if(card) e.dataTransfer.setData('text/plain', card.dataset.k); });
}
setupBoard();
// clic colonne : bascule vers la colonne c (revert si déjà dessus) ; RM → 'mid' par défaut (garde deep si déjà deep)
function applyCol(r, c){                                  // mutation seule (pour l'action groupée : 1 seul render)
  const cur = effCol(r);
  if(c===cur){ delete changes[r.k]; }                    // re-clic colonne active → annule la modif
  else { changes[r.k] = c==='rm' ? (r.b==='deep'?'deep':'mid') : COLS[c].band; }
}
function pushHist(){ _hist.push(JSON.stringify(changes)); if(_hist.length>60) _hist.shift(); }
function assignCol(r, c){ pushHist(); applyCol(r, c); save(); render(); }
function setChange(r, band){ changes[r.k]=band; save(); render(); }

// ── drag & drop entre colonnes ─────────────────────────────────────────────────────────────────────────
document.querySelectorAll('.col').forEach(col=>{
  col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('drop'); });
  col.addEventListener('dragleave', ()=>col.classList.remove('drop'));
  col.addEventListener('drop', async e=>{ e.preventDefault(); col.classList.remove('drop');
    const k = e.dataTransfer.getData('text/plain'); const r = ALL.find(x=>x.k===k);
    if(r){ assignCol(r, col.dataset.c); return; }                       // déplacement interne d'une carte
    const ids = spotifyTrackIds(allDropText(e.dataTransfer));            // sinon : glisser-déposer depuis Spotify (appli ou web)
    if(ids.length && col.dataset.c!=='ex') await dropSpotify(ids, COLS[col.dataset.c].band, col.dataset.c);
  });
});
// Glisser un morceau depuis Spotify → on lit son URL/URI dans le drop, on résout via l'API, on le classe dans la colonne lâchée.
function allDropText(dt){ let s=''; for(const t of ['text/uri-list','text/plain','text/html','URL','text']){ try{ s+=' '+(dt.getData(t)||''); }catch(e){} } return s; }
function spotifyTrackIds(txt){ const ids=new Set(); const re=/(?:open\.spotify\.com\/(?:intl-[a-z-]+\/)?track\/|spotify:track:)([a-zA-Z0-9]{22})/g; let m; while((m=re.exec(txt))) ids.add(m[1]); return [...ids]; }
async function dropSpotify(ids, band, colId){
  toast('Ajout du drop Spotify…');
  try{
    const res = await fetch('/api/curation/drop-spotify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids, band})}).then(r=>r.json());   // serveur résout via la page embed (sans token → plus de 403)
    if(res&&res.ok){
      const col=({gp:'Mainstream',co:'Connaisseur',rm:'Puriste'})[colId];
      const n=(res.resolved||[]).length;
      let msg;
      if(res.added){ msg='✓ +'+res.added+' nouveau'+(res.added>1?'x':'')+(res.spAdded?' · '+res.spAdded+' audio ajouté'+(res.spAdded>1?'s':''):'')+' → '+col; }
      else if(res.spAdded){ msg='↻ déjà dans la base · audio Spotify ajouté ('+res.spAdded+') → '+col; }
      else { msg='= déjà dans la base ('+n+' titre'+(n>1?'s':'')+', rien de neuf) → '+col; }
      toast(msg); await load();
    }
    else toast('Drop: '+((res&&res.error)||'échec'), true);
  }catch(e){ toast('Drop: '+e.message, true); }
}

// ── clavier : 1/2/3 = GP/Co/RM · 4 ou x = hors pool · espace = play/pause · n = suivant ────────────────
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); if(_hist.length){ changes=JSON.parse(_hist.pop()); save(); render(); toast('↶ Annulé'); } else toast('Rien à annuler'); return; }
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  const r = activeKey && ALL.find(x=>x.k===activeKey);
  if(e.key===' '){ e.preventDefault(); if(au.paused){au.play().catch(()=>{});} else au.pause(); return; }
  if(!r) return;
  if(e.key==='1') assignCol(r,'gp'); else if(e.key==='2') assignCol(r,'co'); else if(e.key==='3') assignCol(r,'rm');
  else if(e.key==='4'||e.key.toLowerCase()==='x') assignCol(r,'ex');
});

// ── filtres ──────────────────────────────────────────────────────────────────────────────────────────
const DECS = [['90','90s'],['00','00s'],['10','10s'],['20','20s'],['x','?']];
el('dec').innerHTML = DECS.map(([k,l])=>`<span class="dch" data-d="${k}" title="${k==='x'?'Année inconnue (titre pas encore daté)':'Décennie '+l}">${l}</span>`).join('');
const ALLDEC = ['90','00','10','20','x'];
const syncDec = ()=>document.querySelectorAll('.dch').forEach(ch=>ch.classList.toggle('off', !filt.dec.has(ch.dataset.d)));
document.querySelectorAll('.dch').forEach(c=>c.addEventListener('click',e=>{ const d=c.dataset.d;
  if(e.shiftKey){ if(filt.dec.has(d)) filt.dec.delete(d); else filt.dec.add(d); if(!filt.dec.size) filt.dec=new Set(ALLDEC); }
  else { filt.dec = (filt.dec.size===1 && filt.dec.has(d)) ? new Set(ALLDEC) : new Set([d]); }   // clic = isoler ; reclic = tout ; Maj+clic = multi
  syncDec(); render(); }));
let _qT; el('q').addEventListener('input', ()=>{ clearTimeout(_qT); _qT=setTimeout(()=>{ filt.q = el('q').value.trim().toLowerCase(); render(); }, 140); });  // anti-rebond : plus de re-rendu à chaque frappe
// (filtre « scènes » retiré)
el('tUnl').addEventListener('click', ()=>{ filt.unl=!filt.unl; el('tUnl').classList.toggle('on',filt.unl); render(); });
el('tEd').addEventListener('click', ()=>{ filt.ed=!filt.ed; el('tEd').classList.toggle('on',filt.ed); render(); });
// ── sélection multiple + action groupée ──────────────────────────────────────────────────────────────
function toggleSel(card){ const k=card.dataset.k; if(_sel.has(k)){ _sel.delete(k); card.classList.remove('sel'); } else { _sel.add(k); card.classList.add('sel'); } updateSelBar(); }
function updateSelBar(){ el('selN').textContent=_sel.size; el('selbar').classList.toggle('on', _sel.size>0); }
function clearSel(){ document.querySelectorAll('.card.sel').forEach(c=>c.classList.remove('sel')); _sel.clear(); updateSelBar(); }
el('selbar').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return;
  if(b.id==='selclr'){ clearSel(); return; }
  const c=b.dataset.c; if(!c || !_sel.size) return;
  pushHist();
  for(const k of _sel){ const r=ALL.find(x=>x.k===k); if(r) applyCol(r,c); }
  const n=_sel.size; _sel.clear(); save(); render(); updateSelBar();
  toast('✓ '+n+' déplacé'+(n>1?'s':'')+' → '+({gp:'Mainstream',co:'Connaisseur',rm:'Puriste',ex:'Hors pool'})[c]+' (Ctrl+Z pour annuler)', false, true);
});

// ── export / apply ─────────────────────────────────────────────────────────────────────────────────────
function buildPayload(){
  const labels={}, exclude=[], unexclude=[];
  for(const k in changes){
    const v = changes[k];
    if(v==='exc') exclude.push(k);
    else { labels[k]=v; if(EXSET.has(k)) unexclude.push(k); } // titre re-intégré depuis Hors pool
  }
  return { labels, exclude, unexclude };
}
let _toastT;
function toast(msg, err, stick){ const t=el('toast'); t.textContent=msg; t.classList.toggle('err',!!err); t.classList.toggle('stick',!!stick); t.classList.add('on'); clearTimeout(_toastT); if(stick){ t.onclick=()=>{ t.classList.remove('on'); t.onclick=null; }; } else { t.onclick=null; _toastT=setTimeout(()=>t.classList.remove('on'), 3200); } }
function busy(btn, on){ if(!btn) return; btn.classList.toggle('busy', !!on); btn.disabled=!!on; }
// (barre allégée : Recharger / Exporter retirés — le glisser-déposer + Appliquer suffisent)
// ── Import Spotify : réutilise le token de la session hôte (localStorage pl_spotify, même origine 127.0.0.1) ──
const SP_CLIENT = '4b5842ddb3ef4a1f9f14b789a0a35706';
const SP_CAT = [[/grand\s*public/i,'top'],[/connaisseur/i,'high'],[/rob\s*m|robma[iy]z/i,'mid']];
const spCat = (n)=>{ for(const [re,b] of SP_CAT) if(re.test(n||'')) return b; return null; };
async function spToken(){
  let t; try{ t=JSON.parse(localStorage.getItem('pl_spotify')||'null'); }catch(e){ return null; }
  if(!t||!t.access_token) return null;
  if(Date.now() < (t.expires_at||0) - 60000) return t.access_token;   // encore valide
  if(!t.refresh_token) return null;                                    // expiré, pas de refresh → reconnexion
  try{
    const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:SP_CLIENT,grant_type:'refresh_token',refresh_token:t.refresh_token})});
    const txt=await r.text(); if(!r.ok) return null;
    const j=JSON.parse(txt);
    t={access_token:j.access_token, refresh_token:j.refresh_token||t.refresh_token, expires_at:Date.now()+(j.expires_in||3600)*1000};
    localStorage.setItem('pl_spotify',JSON.stringify(t)); return t.access_token;
  }catch(e){ return null; }
}
async function spGet(url, tok){
  const r=await fetch(url,{headers:{Authorization:'Bearer '+tok}});
  const txt=await r.text();
  if(r.status===401) throw new Error('session expirée (401)');
  if(!r.ok) throw new Error('API '+r.status+(txt?' '+txt.slice(0,80):''));
  if(!txt.trim()) return {};
  try{ return JSON.parse(txt); }catch(e){ throw new Error('réponse inattendue ('+r.status+') : '+txt.slice(0,40)); }
}
async function importSpotify(){
  if(location.hostname!=='127.0.0.1'){ toast('Ouvre cette page sur http://127.0.0.1:5173/base-musicale.html — Spotify refuse les autres adresses', true); return; }
  const tok = await spToken();
  if(!tok){ toast('❌ Pas de token Spotify. Connecte-le sur /host → Connecter Spotify, puis Ctrl+Shift+R ici.', true, true); return; }
  busy(el('spimp'),true); el('spimp').textContent='Lecture…';
  try{
    let pls=[], u='https://api.spotify.com/v1/me/playlists?limit=50';
    while(u){ const d=await spGet(u,tok); pls=pls.concat(d.items||[]); u=d.next; }
    const targets=pls.filter(p=>p&&spCat(p.name));
    if(!targets.length){ busy(el('spimp'),false); el('spimp').textContent='🎧 Importer Spotify'; toast('Aucune playlist « grand public / connaisseurs / Rob MyZ » ('+pls.length+' playlists vues)', true); return; }
    const tracks=[], errs=[];
    for(const p of targets){ const band=spCat(p.name);
      let u2='https://api.spotify.com/v1/playlists/'+p.id+'/items?limit=100&additional_types=track';   // /items (le /tracks est déprécié → source du bug)
      try{ while(u2){ const d=await spGet(u2,tok); for(const it of (d.items||[])){ const tr=it&&(it.track||it.item); if(tr&&tr.name&&tr.artists&&tr.artists.length){ const yr=+((tr.album&&tr.album.release_date||'').slice(0,4))||0;
        const art=tr.artists[0].name+(tr.artists.length>1?' feat. '+tr.artists.slice(1).map(a=>a.name).join(', '):''); tracks.push({artist:art, title:tr.name, band, year:yr, cover:(tr.album&&tr.album.images&&tr.album.images[0]&&tr.album.images[0].url)||''}); } } u2=d.next; } }
      catch(e){ errs.push(p.name+': '+e.message); }
    }
    if(!tracks.length){ busy(el('spimp'),false); el('spimp').textContent='🎧 Importer Spotify'; toast('0 titre lu'+(errs.length?' — '+errs[0]:''), true); return; }
    const res=await fetch('/api/curation/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tracks})}).then(r=>r.json());
    busy(el('spimp'),false); el('spimp').textContent='🎧 Importer Spotify';
    if(res&&res.ok){ const msg = res.added ? ('✓ '+res.added+' titres ajoutés'+(res.updated?' · '+res.updated+' reclassés':'')+(errs.length?' · '+errs.length+' pl. KO':'')) : ('Tes playlists sont déjà dans la base — rien de neuf ici. Pour les titres MUETS, clique plutôt « 🔊 Remplir l\'audio manquant » (l\'autre bouton).'); toast(msg, false, true); await load(); }
    else toast('Import échoué: '+((res&&res.error)||''), true, true);
  }catch(e){ busy(el('spimp'),false); el('spimp').textContent='🎧 Importer Spotify'; toast('Spotify: '+e.message, true, true); }
}
// (bouton « Importer Spotify » retiré — la sync des playlists se fait côté serveur)
// ── Remplir l'audio + cover des titres MUETS via la recherche Spotify (ton token, dans TON navigateur) ──
const _nrm = (s)=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\(.*?\)|\[.*?\]/g,'').replace(/[^a-z0-9]/g,'');
async function fillSpotify(){
  const btn=el('spfill');
  if(location.hostname!=='127.0.0.1'){ toast('Ouvre cette page sur http://127.0.0.1:5173/base-musicale.html (Spotify refuse les autres adresses)', true, true); return; }
  const tok = await spToken();
  if(!tok){ toast('❌ Pas de token Spotify. Connecte-le sur /host → Connecter Spotify, puis Ctrl+Shift+R ici.', true, true); return; }
  const res = await fetch('/api/curation?_='+Date.now(),{cache:'no-store'}).then(r=>r.json()).catch(()=>null);
  if(!res){ toast('Serveur injoignable', true, true); return; }
  const muets = res.rows.filter(r=>!r.preview && !r.sp && r.b!=='exc');
  if(!muets.length){ toast('Aucun titre muet 🎉', false, true); return; }
  busy(btn,true); btn.textContent='démarrage…';
  let found=0, done=0, buf=[], firstStatus=null;
  const flush=async()=>{ if(buf.length){ const b=buf.splice(0); await fetch('/api/curation/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tracks:b})}).catch(()=>{}); } };
  const reset=()=>{ busy(btn,false); btn.textContent='🔊 Remplir l\'audio manquant'; };
  const sp=async(q)=>{ const r=await fetch('https://api.spotify.com/v1/search?type=track&market=FR&limit=8&q='+encodeURIComponent(q),{headers:{Authorization:'Bearer '+tok}}); if(firstStatus===null) firstStatus=r.status; if(!r.ok){ const e=new Error('HTTP '+r.status); e.status=r.status; throw e; } return r.json(); };
  for(const r of muets){
    const prim = r.a.split(/\s*(?:feat\.?|ft\.?|featuring|avec|&|,| x )\s*/i)[0].trim();
    const nt=_nrm(r.t), na=_nrm(prim);
    try{
      let it=[];
      for(const q of ['artist:"'+prim+'" track:"'+r.t.replace(/"/g,'')+'"', prim+' '+r.t]){ const d=await sp(q); it=(d.tracks&&d.tracks.items)||[]; if(it.length) break; }
      const hit = it.find(t=>{ const tn=_nrm(t.name); const an=(t.artists||[]).some(a=>{const x=_nrm(a.name); return x&&(x.includes(na)||na.includes(x));}); return an && (tn===nt || (tn.includes(nt)||nt.includes(tn)) && Math.min(tn.length,nt.length)>=5); });
      if(hit){ buf.push({ artist:r.a, title:r.t, band:r.b, spId:hit.id, cover:(hit.album&&hit.album.images&&hit.album.images[0]&&hit.album.images[0].url)||'', year:+((hit.album&&hit.album.release_date||'').slice(0,4))||0 }); found++; }
    }catch(e){
      if(e.status===401){ await flush(); reset(); return toast('⚠ Token Spotify expiré (401). Reconnecte sur /host puis relance.', true, true); }
      if(e.status===403){ await flush(); reset(); return toast('⚠ Spotify bloque l\'API (403) : ton compte n\'est pas autorisé sur l\'app (mode Développement). Vercel n\'y changerait rien — il faut t\'ajouter dans les réglages de l\'app Spotify.', true, true); }
      if(e.status===429){ await new Promise(x=>setTimeout(x,3000)); } // throttle → pause
    }
    done++;
    if(buf.length>=20) await flush();
    if(done%5===0) btn.textContent=done+'/'+muets.length+' · '+found+' trouvés';
    await new Promise(x=>setTimeout(x,110));
  }
  await flush(); reset();
  if(found) toast('✓ '+found+' audios + covers récupérés sur '+muets.length+' titres muets ! (clic pour fermer)', false, true);
  else toast('0 trouvé sur '+muets.length+'. Spotify a répondu « '+firstStatus+' » à la 1re requête → dis-moi ce numéro.', true, true);
  await load();
}
el('spfill').addEventListener('click', fillSpotify);
// ── Remplir l'audio des titres muets en les cherchant sur Spotify (token utilisateur, usage légitime de l'API) ──
const _norm = (s)=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\(.*?\)/g,'').replace(/[^a-z0-9]/g,'');
async function fillSpotify(){
  if(location.hostname!=='127.0.0.1'){ toast('Ouvre cette page sur http://127.0.0.1:5173/base-musicale.html', true); return; }
  const tok = await spToken();
  if(!tok){ toast('Connecte Spotify dans le jeu (/host → Connecter Spotify) d\'abord', true); return; }
  const res = await fetch('/api/curation?_='+Date.now(), {cache:'no-store'}).then(r=>r.json()).catch(()=>null);
  if(!res){ toast('serveur injoignable', true); return; }
  const muets = res.rows.filter(r=>!r.preview && !r.sp && r.b!=='exc');
  if(!muets.length){ toast('Aucun titre muet 🎉', false); return; }
  el('spfill').textContent='0/'+muets.length;
  let found=0, done=0, buf=[];
  for(const r of muets){
    const primary = r.a.split(/\s*(?:feat\.?|ft\.?|featuring|avec|&|,| x )\s*/i)[0].trim();
    try{
      const d = await spGet('https://api.spotify.com/v1/search?type=track&market=FR&limit=5&q='+encodeURIComponent('artist:"'+primary+'" track:"'+r.t+'"'), tok);
      const it = (d.tracks&&d.tracks.items)||[];
      const nt=_norm(r.t), na=_norm(primary);
      const hit = it.find(t=>{ const tn=_norm(t.name), an=(t.artists||[]).some(a=>{const x=_norm(a.name); return x&&(x.includes(na)||na.includes(x));}); return an && (tn===nt||tn.includes(nt)||nt.includes(tn)); });
      if(hit){ buf.push({artist:r.a, title:r.t, band:r.b, spId:hit.id}); found++; }
    }catch(e){ if((''+e.message).includes('401')){ toast('Session Spotify expirée — reconnecte dans le jeu', true); el('spfill').textContent='🔊 Remplir audio'; return; } }
    done++;
    if(buf.length>=40){ await fetch('/api/curation/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tracks:buf.splice(0)})}).catch(()=>{}); }
    if(done%10===0) el('spfill').textContent=done+'/'+muets.length+' ('+found+')';
    await new Promise(r=>setTimeout(r,50));
  }
  if(buf.length) await fetch('/api/curation/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tracks:buf})}).catch(()=>{});
  el('spfill').textContent='🔊 Remplir audio';
  toast('✓ '+found+' audios Spotify récupérés sur '+muets.length+' muets'); await load();
}

// ── Pool artiste : au clic sur un nom d'artiste → son TOP Spotify (classé par popularité ≈ streams, via l'embed) ──
const _dn = (s)=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\(.*?\)|\[.*?\]/g,'').replace(/\b(feat|ft|featuring|avec)\b\.?/g,'').replace(/,.*$/,'').replace(/[^a-z0-9]+/g,'');
const _primary = (a)=> (String(a).split(/\s*(?:feat\.?|ft\.?|featuring|avec|&|,| x )\s*/i)[0]||a).trim();
let _apTracks = new Map();   // dz-id → titre Deezer (pour l'ajout au clic, sans encombrer le DOM)
const fmtFan = (n)=> (n||0).toLocaleString('fr-FR');
async function showArtistPool(name){
  const panel = el('apool'), body = el('apool-b');
  el('apool-t').textContent = 'Explorer — '+name;
  body.innerHTML = '<div class="ap-msg">chargement…</div>'; panel.classList.add('on');
  _apTracks = new Map();
  let res=null; try{ res = await fetch('/api/curation/deezer-artist?q='+encodeURIComponent(name), {cache:'no-store'}).then(r=>r.json()); }catch(e){}
  if(!res||!res.ok||!res.tracks||!res.tracks.length){ body.innerHTML = '<div class="ap-msg">Rien trouvé pour « '+esc(name)+' » sur Deezer'+((res&&res.error)?' — '+esc(res.error):'')+'.</div>'; return; }
  const COLN = {top:'Mainstream',high:'Connaisseur',mid:'Puriste',deep:'Puriste',exc:'Hors pool'};
  const want = _dn(_primary(name));
  const findRow = (t)=>{ let row = t.dz && ALL.find(r=> r.dz===String(t.dz)); if(!row){ const tn=_dn(t.title); row = ALL.find(r=> _dn(r.t)===tn && _dn(_primary(r.a)).includes(want)); } return row; };
  const a = res.artist;
  const head = '<div class="ap-artist">'+(a.picture?'<img src="'+esc(a.picture)+'" alt="">':'<span class="ap-cv" style="width:46px;height:46px;border-radius:50%"></span>')+
    '<div style="min-width:0"><div class="ap-an">'+esc(a.name)+'</div><div class="ap-af">'+(a.nb_fan?'♥ '+fmtFan(a.nb_fan)+' fans':'artiste Deezer')+'</div></div></div>';
  const maxRank = Math.max(1, ...res.tracks.map(t=>t.rank||0));
  const rowsHtml = res.tracks.map(t=>{
    _apTracks.set(String(t.dz), t);
    const row = findRow(t);
    const cov = t.cover?'<img class="ap-cv" loading="lazy" src="'+esc(t.cover)+'" alt="">':'<span class="ap-cv"></span>';
    const pct = Math.round((t.rank||0)/maxRank*100);
    const info = '<div class="ap-t">'+esc(t.title)+'</div><div class="ap-a"><span class="ap-pop" title="Popularité Deezer (rank '+fmtFan(t.rank)+')"><i style="width:'+pct+'%"></i></span></div>';
    const right = row ? '<span class="ap-in">✓ '+(COLN[row.b]||'')+'</span>'
      : '<span class="ap-add"><button data-dz="'+esc(String(t.dz))+'" data-band="top">Main</button><button data-dz="'+esc(String(t.dz))+'" data-band="high">Conn</button><button data-dz="'+esc(String(t.dz))+'" data-band="mid">Puri</button></span>';
    return '<div class="ap-row'+(row?' has':'')+'">'+cov+'<div class="ap-meta2">'+info+'</div>'+right+'</div>';
  }).join('');
  body.innerHTML = head + rowsHtml;
}
el('apool-x').addEventListener('click', ()=>el('apool').classList.remove('on'));
el('apool-b').addEventListener('click', async e=>{
  const b = e.target.closest('button[data-dz]'); if(!b) return;
  const band=b.dataset.band, dz=b.dataset.dz, t=_apTracks.get(dz); if(!t) return;

  if(res&&res.ok&&(res.added||res.updated)){ toast('✓ ajouté → '+({top:'Mainstream',high:'Connaisseur',mid:'Puriste'})[band]); await load(); if(span){ const row=span.closest('.ap-row'); if(row) row.classList.add('has'); span.outerHTML='<span class="ap-in">✓ ajouté</span>'; } }
  else if(res&&res.ok){ toast('= déjà dans la base'); if(span){ const row=span.closest('.ap-row'); if(row) row.classList.add('has'); span.outerHTML='<span class="ap-in">✓ déjà là</span>'; } }
  else { if(span) span.innerHTML='<button data-dz="'+esc(dz)+'" data-band="'+band+'">réessayer</button>'; toast('Échec'+((res&&res.error)?' : '+res.error:''), true); }
});
// ── Tableau de bord Artistes : agrège la base par artiste principal + compte par tier ──
const _adSt = { sort:'tot', q:'' };
function adAggregate(){
  const m = new Map();
  for(const r of ALL){
    const pa = _primary(r.a);
    const key = _dn(pa) || pa.toLowerCase();
    let o = m.get(key);
    if(!o){ o = { name:pa, gp:0, co:0, rm:0, ex:0, unl:0 }; m.set(key, o); }
    const c = effCol(r); o[c]++;
    if(isUnl(r) && c!=='ex') o.unl++;
  }
  const arr = [...m.values()];
  for(const o of arr){ o.pool = o.gp + o.co + o.rm; o.thin = o.pool > 0 && o.pool <= 2; }
  return arr;
}
function renderDash(){
  let arr = adAggregate();
  const q = _adSt.q;
  if(q) arr = arr.filter(o=> _dn(o.name).includes(q));
  const cmp = {
    tot:(a,b)=> b.pool-a.pool || b.gp-a.gp,
    thin:(a,b)=> (a.pool||99)-(b.pool||99) || b.gp-a.gp,   // couvertures fines d'abord (mais garde ceux qui ont des titres)
    gp:(a,b)=> b.gp-a.gp, co:(a,b)=> b.co-a.co, rm:(a,b)=> b.rm-a.rm, unl:(a,b)=> b.unl-a.unl,
    name:(a,b)=> a.name.localeCompare(b.name,'fr'),
  }[_adSt.sort] || ((a,b)=> b.pool-a.pool);
  arr.sort(cmp);
  const totPool = arr.reduce((s,o)=> s+o.pool, 0);
  el('ad-sub').textContent = arr.length+' artiste'+(arr.length>1?'s':'')+' · '+totPool+' titre'+(totPool>1?'s':'')+' dans le pool';
  const cell = (v,cls)=> '<td class="c '+cls+(v?' v':'')+'">'+(v||'·')+'</td>';
  el('ad-body').innerHTML = arr.length ? arr.map((o,i)=>
    '<tr data-a="'+esc(o.name)+'"'+(o.thin?' class="thin"':'')+'>'+
    '<td class="rank">'+(i+1)+'</td>'+
    '<td class="l" title="'+esc(o.name)+' — clic : voir son top + l\'ajouter">'+esc(o.name)+'</td>'+
    cell(o.gp,'cg')+cell(o.co,'cc')+cell(o.rm,'cr')+cell(o.ex,'ce')+
    '<td class="c ct">'+(o.pool||'·')+'</td>'+cell(o.unl,'cu')+
    '</tr>').join('') : ('<tr><td colspan="8" class="ad-empty">'+(el('ad-q').value.trim()
      ? '« '+esc(el('ad-q').value.trim())+' » n\'est pas dans ta base.<br><button class="ad-explore" data-x="'+esc(el('ad-q').value.trim())+'">🔎 Explorer sur Deezer pour l\'ajouter</button>'
      : 'Aucun artiste.')+'</td></tr>');
}

// ── mode « Oubliés » : artistes rap FR connus ABSENTS de la base (liste de référence croisée avec la base) ──
let _sugg = null;
async function renderGaps(){
  const box = el('ad-gaps');
  if(_sugg === null){
    box.innerHTML = '<div class="ad-gaps-msg">chargement…</div>';
    try{ const r = await fetch('/api/curation/suggestions',{cache:'no-store'}).then(r=>r.json()); _sugg = (r&&r.artists)||[]; }catch(e){ _sugg = []; }
  }
  if(!_sugg.length){ box.innerHTML = '<div class="ad-gaps-msg">Liste de référence pas encore générée.<br>(le recensement des artistes rap FR arrive)</div>'; el('ad-sub').textContent=''; return; }
  // croisement tolérant aux variantes de nom (ex. « Gims » dans la base = « Maître Gims » de la liste ; « Disiz » = « Disiz la Peste »)
  const baseArr = adAggregate().map(o=>_dn(o.name)).filter(Boolean);
  const baseSet = new Set(baseArr);
  const inBase = (nm)=>{ const k=_dn(nm); if(!k) return false; if(baseSet.has(k)) return true;
    return baseArr.some(bk=> bk.length>=4 && (k.includes(bk) || (k.length>=4 && bk.includes(k)))); };
  let miss = _sugg.filter(a=> a && a.name && !inBase(a.name));
  const q = _adSt.q; if(q) miss = miss.filter(a=> _dn(a.name).includes(q));
  miss.sort((a,b)=> (b.nb_fan||0)-(a.nb_fan||0) || a.name.localeCompare(b.name,'fr'));
  el('ad-sub').textContent = miss.length+' artiste'+(miss.length>1?'s':'')+' rap FR absent'+(miss.length>1?'s':'')+' de ta base';
  const TL = {mainstream:['Mainstream','t-main'], connaisseur:['Connaisseur','t-conn'], puriste:['Puriste','t-puri']};
  const ERA = {'90':'90s','00':'00s','10':'10s','20':'20s'};
  box.innerHTML = miss.length ? miss.map((a,i)=>{
    const tl = TL[String(a.tier||'').toLowerCase()] || ['—','t-conn'];
    const era = ERA[String(a.era)] || '';
    return '<div class="gap-row" data-x="'+esc(a.name)+'">'+
      '<span class="gap-rk">'+(i+1)+'</span>'+
      '<span class="gap-n" title="'+esc(a.signature?('ex. '+a.signature):a.name)+'">'+esc(a.name)+'</span>'+
      (era?'<span class="gap-era">'+era+'</span>':'')+
      '<span class="gap-tier '+tl[1]+'">'+tl[0]+'</span>'+
      '<span class="gap-fan">'+(a.nb_fan?'♥ '+(a.nb_fan).toLocaleString('fr-FR'):'')+'</span>'+
      '<button class="gap-go" data-x="'+esc(a.name)+'">Explorer →</button>'+
    '</div>';
  }).join('') : '<div class="ad-gaps-msg">Aucun manquant pour ce filtre. 🎉</div>';
}
function setMode(m){
  _adSt.mode = m;
  document.querySelectorAll('#ad-seg button').forEach(b=> b.classList.toggle('on', b.dataset.m===m));
  const gaps = m==='gaps';
  el('ad-tab').style.display = gaps?'none':'';
  el('ad-gaps').style.display = gaps?'':'none';
  el('ad-sort').style.display = gaps?'none':'';
  const sl=document.querySelector('.ad-sortl'); if(sl) sl.style.display = gaps?'none':'';
  if(gaps) renderGaps(); else renderDash();
}
el('ad-seg').addEventListener('click', e=>{ const b=e.target.closest('button[data-m]'); if(b) setMode(b.dataset.m); });
el('ad-gaps').addEventListener('click', e=>{ const g=e.target.closest('[data-x]'); if(!g) return; closeDash(); showArtistPool(g.dataset.x); });

load();
